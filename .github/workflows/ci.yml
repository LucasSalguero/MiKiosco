name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valor ficticio: prisma generate lo exige, pero no se conecta a ninguna base.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
