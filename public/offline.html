<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087c59" />
    <title>Mi Kiosco sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #172033;
        background: #f5f7fa;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(420px, calc(100% - 40px));
        padding: 24px;
        border: 1px solid #dce2ea;
        border-radius: 8px;
        background: #fff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #657086;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Cuando vuelva internet, recargá Mi Kiosco para continuar.</p>
    </main>
  </body>
</html>
